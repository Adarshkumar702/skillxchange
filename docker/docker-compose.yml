version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillxchange_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skillxchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillxchange_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: skillxchange_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/skillxchange?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
      NODE_ENV: "production"
      CLIENT_URL: "http://localhost:3000"
      JWT_SECRET: "docker-production-secret-jwt-key"
      JWT_REFRESH_SECRET: "docker-production-refresh-secret"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: skillxchange_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    depends_on:
      - api

volumes:
  pgdata:
